springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    persist-authorization: false

spring:
  application:
    name: podo-server

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${POSTGRES_DB:podo}}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  flyway:
    default-schema: app

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
    open-in-view: false

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB

  jackson:
    deserialization:
      fail-on-unknown-properties: true

podo:
  books:
    api-key: ${YONGIN_LIBRARY_API_KEY:}
    recommendations: []

  auth:
    api-origin: ${API_ORIGIN:https://localhost:8443}
    success-redirect-uri: ${AUTH_SUCCESS_REDIRECT_URI:${API_ORIGIN:https://localhost:8443}/auth/success}
    failure-redirect-uri: ${AUTH_FAILURE_REDIRECT_URI:${API_ORIGIN:https://localhost:8443}/auth/error}
    csrf-signing-key: ${AUTH_CSRF_SIGNING_KEY:}
    withdrawal:
      admin-key: ${KAKAO_ADMIN_KEY:}
      connect-timeout: 5s
      request-timeout: 15s
      lease-duration: 5m
      poll-interval: 5s
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:${API_ORIGIN:https://localhost:8443}/api/auth/callback/kakao}

  profile:
    image-directory: ${PODO_PROFILE_IMAGE_DIRECTORY:./var/profile-images}
    options:
      age-bands: []
      colors: []

  observation:
    enabled: ${PODO_OBSERVATION_ENABLED:false}
    auto-publish: ${PODO_OBSERVATION_AUTO_PUBLISH:false}
    worker-enabled: ${PODO_OBSERVATION_WORKER_ENABLED:true}
    storage-directory: ${PODO_OBSERVATION_DIRECTORY:./var/observations}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    connect-timeout: 5s
    request-timeout: 90s
    lease-duration: 5m
    poll-interval: 5s
    max-attempts: 3
    max-uploads-per-visit: 3
